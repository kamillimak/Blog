name: Generate daily AI/IT news briefing

on:
  schedule:
    # 05:00 UTC = 06:00 CET / 07:00 CEST (rano czasu polskiego)
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Nadpisz dzisiejszy briefing, jeśli już istnieje"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_REGENERATE: ${{ github.event.inputs.force }}
        run: npm run generate:daily-news

      - name: Commit and push
        run: |
          git config user.name "daily-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/daily-news
          if git diff --cached --quiet; then
            echo "Brak nowych zmian - nic do commitowania."
          else
            git commit -m "chore: daily AI/IT news briefing $(date -u +%Y-%m-%d)"
            git push
          fi